services:
  - type: web
    name: news-polar-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # OPENAI_API_KEY is an OpenRouter key — these route it there instead of
      # api.openai.com (see src/nlp/openai_config.py). Not secret, so they're
      # provisioned automatically instead of requiring manual dashboard entry.
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL
        value: openai/gpt-4o-mini
      - key: CORS_ORIGINS
        sync: false
