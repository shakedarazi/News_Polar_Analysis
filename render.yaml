services:
  - type: web
    name: news-polar-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      # A real OpenAI key, distinct from the OpenRouter key the ingestion
      # workflow uses — the two workloads never share a process, so each gets
      # its own credential from its own environment. Deliberately no
      # OPENAI_BASE_URL/OPENAI_MODEL here: their absence is what makes
      # src/nlp/openai_config.py talk to api.openai.com and default to the
      # bare "gpt-4o-mini" model id this key expects. Setting them would
      # override the dashboard on every deploy and send this key to OpenRouter.
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
