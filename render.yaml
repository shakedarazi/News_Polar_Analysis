services:
  - type: web
    name: news-polar-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # User-facing AI only (summary / bias / Q&A) — a real OpenAI key hitting
      # api.openai.com. Classify during ingestion uses the OpenRouter key on
      # GitHub Actions (OPENAI_INGESTION_*). Do not put the OpenRouter key or
      # OPENAI_BASE_URL here, or user actions would share that credit pool.
      # OPENAI_MODEL is not secret; provisioned automatically.
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CORS_ORIGINS
        sync: false
