services:
  db:
    image: postgres:16
    container_name: news_polar_db
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news_polar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news_polar"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
