services:
  db:
    # Stock postgres:16 has no pgvector, and sql/migrations/009_embeddings.sql
    # opens with CREATE EXTENSION vector — so `python pipeline/init_db.py`
    # against a fresh local database failed outright from the moment that
    # migration landed. Neon ships the extension, so only local dev broke, and
    # only for someone starting from an empty volume.
    #
    # This image is the same Postgres 16 with the extension available; it is
    # not a different database.
    image: pgvector/pgvector:pg16
    container_name: news_polar_db
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news_polar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news_polar"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
