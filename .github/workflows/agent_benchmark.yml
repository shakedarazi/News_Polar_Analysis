name: Agent-layer benchmark

# Manual only. The demo layer is a frozen exhibit that lives on this branch
# and is never merged into main, so a push trigger scoped to demo/** on
# main could never fire. Run it from the Actions tab against this branch.
on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r demo/requirements.txt
      # First, and deliberately: the golden set is committed and the scoring
      # reads nothing else, so a stale stratum weight or an unlabelled pair
      # fails here in seconds instead of after the snapshot export and the
      # ~20 minute agent loop.
      - name: Score retrieval against the golden set
        run: PYTHONPATH=. python demo/evals/run_evals.py

      - name: Build snapshot + index (from Neon, read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          PYTHONPATH=. python demo/snapshot/export_snapshot.py
          PYTHONPATH=. python demo/snapshot/prepare_demo.py
      - name: Run benchmark (offline mode, deterministic)
        env:
          DEMO_SPEED: "0.02"
        run: PYTHONPATH=. python demo/benchmark.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-benchmark
          path: |
            demo/benchmark.json
            demo/data/evals.json
