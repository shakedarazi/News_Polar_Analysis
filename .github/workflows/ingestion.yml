name: Scheduled ingestion

# Runs crawl -> comments -> analyze against the hosted Neon database on a
# timer, with AI classification as a best-effort bonus at the end. This is the
# only scheduling mechanism for ingestion — it replaced both an OS-cron setup
# (unreliable on developer machines) and an in-process APScheduler (which
# required the API host to stay running 24/7 just to fire a timer). Decoupling
# the schedule from the API host means the backend (Render) is free to spin
# down when idle without affecting data freshness.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    # The longest run that completed successfully took 57 minutes, so a 60
    # minute cap left almost no headroom — a slightly slow crawl would have
    # been killed and read as a failure. Successful runs span 29-57 minutes;
    # 90 keeps the cap as a runaway backstop rather than a routine tripwire.
    # Still well inside the 6h cron gap, so runs cannot overlap.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      # Torch and sentence-transformers, for the article embeddings that back
      # semantic event clustering. Deliberately a separate file and a separate
      # step: Render installs requirements.txt and has 512MB of RAM, which
      # torch does not fit in and does not need to - the API only reads the
      # vectors this job writes. Kept non-fatal because embedding is a bonus
      # step; if the install fails the run still crawls, fetches and analyses,
      # and event detection falls back to the lexical grouping.
      - name: Install embedding dependencies
        continue-on-error: true
        run: .venv/bin/pip install -r requirements-embed.txt

      # Downloading multilingual-e5-small on every run costs about 470MB of
      # transfer and a minute of the clock. Keyed on the requirements file, so
      # a model change invalidates it.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('requirements-embed.txt') }}-multilingual-e5-small

      - name: Install Playwright Chromium (haaretz comments)
        run: .venv/bin/playwright install --with-deps chromium

      - name: Run ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Existing OpenRouter key (GitHub secret still named OPENAI_API_KEY).
          # Injected as OPENAI_INGESTION_API_KEY so it cannot be confused with
          # Render's real OpenAI key used for summary / bias / Q&A.
          OPENAI_INGESTION_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_INGESTION_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_INGESTION_MODEL: openai/gpt-4o-mini
          # The assistant's retrieval chunks are embedded on this same
          # OpenRouter key — its /embeddings endpoint routes
          # openai/text-embedding-3-small to OpenAI, which is the same model
          # Render uses to embed the visitor's question. No third key, and no
          # third credit pool. See src/rag/embedding.py.
        run: bash scripts/run_ingestion.sh

      - name: Upload ingestion logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-logs
          path: logs/ingestion/*.log
          retention-days: 14
